# ============================================================
# PROMETHEUS CONFIGURATION
# prometheus.yml
# ============================================================
global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'self-heal-backend'
    static_configs:
      - targets: ['backend:9090']
    scrape_interval: 10s
    metrics_path: /metrics
